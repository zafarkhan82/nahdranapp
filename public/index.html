<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1B3A93">
<title>NAHDRAN</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Fira+Sans:wght@400;500;600;700&family=Fira+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Marken-Tokens */
  --emaille:#1B3A93;--ink:#12161A;--pflaster:#EAE8E1;--weiss:#FFF;--signal:#FF4A0F;--grau:#7A766E;--linie:#D6D3CA;
  /* aus den Tokens abgeleitete Tiefen und Lichter, nur für Verläufe und Flächen */
  --emaille-tief:#122A6E;--emaille-hell:#2E58CC;--signal-hell:#FF7A3D;--signal-tief:#DC3B08;
  --papier:#F5F3ED;--papier-tief:#DFDCD3;--ink-weich:#3A4048;
  --gruen:#1B7A3D;--gruen-weich:#E4F2E8;--gelb:#B26B00;--gelb-weich:#FBF0DC;
  /* Verläufe */
  --grad-emaille:linear-gradient(135deg,var(--emaille-tief) 0%,var(--emaille) 48%,var(--emaille-hell) 100%);
  --grad-signal:linear-gradient(135deg,var(--signal-hell) 0%,var(--signal) 55%,var(--signal-tief) 100%);
  --grad-ink:linear-gradient(135deg,#242A31 0%,var(--ink) 100%);
  --grad-papier:linear-gradient(180deg,var(--papier) 0%,var(--pflaster) 100%);
  --glanz:linear-gradient(160deg,rgba(255,255,255,.28) 0%,rgba(255,255,255,0) 55%);
  /* Form und Tiefe */
  --r-s:10px;--r-m:16px;--r-l:22px;--r-xl:28px;--r-pill:999px;
  --sh-1:0 1px 2px rgba(18,22,26,.05),0 6px 16px -10px rgba(18,22,26,.18);
  --sh-2:0 2px 6px rgba(18,22,26,.06),0 18px 40px -16px rgba(18,22,26,.28);
  --sh-signal:0 8px 22px -10px rgba(255,74,15,.65);
  --sh-emaille:0 8px 22px -12px rgba(27,58,147,.6);
  --display:"Anton",sans-serif;--body:"Fira Sans",system-ui,sans-serif;--mono:"Fira Mono",monospace;
  --ease:cubic-bezier(.22,.9,.28,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body,#root{height:100%}
body{
  font-family:var(--body);color:var(--ink);background:var(--pflaster);
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
}
button,input,select,textarea{font-family:inherit}
button{cursor:pointer}
a{color:var(--emaille)}
:focus-visible{outline:2.5px solid var(--emaille);outline-offset:2px;border-radius:4px}
.ic{flex:none;display:block}

/* ─── Shell ─────────────────────────────────────────────────────── */
.app{
  max-width:480px;margin:0 auto;height:100%;display:flex;flex-direction:column;
  background:var(--grad-papier);position:relative;overflow:hidden;isolation:isolate;
}
.main{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;scroll-behavior:smooth}
.main::-webkit-scrollbar{width:0}
@media(min-width:600px) and (min-height:720px){
  body{background:radial-gradient(1200px 700px at 50% -10%,#F7F5F0,var(--pflaster) 60%,var(--papier-tief))}
  .app{height:calc(100% - 40px);margin:20px auto;border-radius:var(--r-xl);box-shadow:var(--sh-2)}
}

/* ─── Header ────────────────────────────────────────────────────── */
.hdr{
  flex:none;position:relative;padding:calc(14px + env(safe-area-inset-top)) 16px 14px;
  background:var(--grad-emaille);color:#fff;overflow:hidden;
}
.hdr::before{content:"";position:absolute;inset:0;background:var(--glanz);pointer-events:none}
.hdr::after{
  content:"";position:absolute;left:-40px;top:-90px;width:220px;height:220px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.18),rgba(255,255,255,0) 70%);pointer-events:none;
}
.hdr-row{position:relative;z-index:1;display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.hdr .eyebrow{font-family:var(--mono);font-size:9.5px;letter-spacing:.22em;text-transform:uppercase;color:rgba(255,255,255,.72)}
.hdr h1{font-family:var(--display);font-size:29px;line-height:1;text-transform:uppercase;font-weight:400;margin-top:3px;letter-spacing:.01em}
.hdr-actions{display:flex;gap:8px;align-items:center}
.hdr-btn{
  width:40px;height:40px;border-radius:var(--r-pill);border:1px solid rgba(255,255,255,.28);
  background:rgba(255,255,255,.12);color:#fff;display:grid;place-items:center;
  backdrop-filter:blur(6px);transition:background .18s var(--ease),transform .18s var(--ease);
}
.hdr-btn:hover{background:rgba(255,255,255,.24)}
.hdr-btn:active{transform:scale(.94)}
.geo-pill{
  position:relative;z-index:1;margin-top:12px;display:inline-flex;align-items:center;gap:7px;
  background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);border-radius:var(--r-pill);
  padding:6px 12px 6px 10px;font-family:var(--mono);font-size:10.5px;letter-spacing:.04em;color:#fff;
}
.geo-pill .dot{width:7px;height:7px;border-radius:50%;background:var(--signal-hell);box-shadow:0 0 0 3px rgba(255,122,61,.25)}
.geo-pill.live .dot{background:#7BE3A0;box-shadow:0 0 0 3px rgba(123,227,160,.25)}
.geo-cta{
  position:relative;z-index:1;margin-top:10px;width:100%;display:flex;align-items:center;gap:10px;text-align:left;
  background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.26);border-radius:var(--r-m);
  padding:11px 12px;color:#fff;font-size:12.5px;line-height:1.35;transition:background .18s var(--ease)
}
.geo-cta:hover{background:rgba(255,255,255,.22)}
.geo-cta strong{display:block;font-size:13px;font-weight:600}
.geo-cta span{color:rgba(255,255,255,.75)}
.geo-cta .go{margin-left:auto;opacity:.8}

/* ─── Chips / Filter ────────────────────────────────────────────── */
.chips-wrap{position:sticky;top:0;z-index:5;padding:12px 0 10px;background:linear-gradient(180deg,var(--papier) 62%,rgba(245,243,237,0));backdrop-filter:blur(8px)}
.chips{display:flex;gap:7px;overflow-x:auto;padding:0 16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:none;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;
  background:var(--weiss);border:1px solid var(--linie);border-radius:var(--r-pill);
  padding:8px 13px;font-size:13px;font-weight:500;color:var(--ink);box-shadow:var(--sh-1);
  transition:transform .16s var(--ease),border-color .16s var(--ease),background .16s var(--ease);
}
.chip:hover{border-color:var(--grau)}
.chip:active{transform:scale(.96)}
.chip .n{font-family:var(--mono);font-size:11px;opacity:.55}
.chip.on{background:var(--grad-ink);color:#fff;border-color:transparent;box-shadow:var(--sh-1)}
.chip.on .n{opacity:.7}
.chip.radius{background:var(--weiss);border-style:dashed;font-family:var(--mono);font-size:12px;letter-spacing:.02em}
.chip.radius .ic{color:var(--emaille)}

/* ─── Feed / Karten ────────────────────────────────────────────── */
.feed{padding:4px 16px 10px;display:flex;flex-direction:column;gap:11px}
.card{
  position:relative;width:100%;text-align:left;font:inherit;color:inherit;display:flex;gap:12px;
  background:var(--weiss);border:1px solid var(--linie);border-radius:var(--r-l);padding:13px;
  box-shadow:var(--sh-1);transition:transform .18s var(--ease),box-shadow .18s var(--ease),border-color .18s var(--ease);
}
.card:hover{border-color:#C3BFB4;box-shadow:var(--sh-2);transform:translateY(-1px)}
.card:active{transform:scale(.985)}
.ava{
  width:54px;height:54px;flex:none;border-radius:18px;display:grid;place-items:center;position:relative;
  font-family:var(--display);font-size:19px;color:#fff;overflow:hidden;letter-spacing:.02em;
  box-shadow:0 6px 16px -8px rgba(18,22,26,.5);
}
.ava::after{content:"";position:absolute;inset:0;background:var(--glanz)}
.ava span{position:relative;z-index:1}
.c-body{flex:1;min-width:0;display:block}
.c-top{display:flex;align-items:center;gap:6px;margin-bottom:3px}
.c-cat{font-family:var(--mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--grau)}
.c-body h3{font-size:15px;font-weight:600;line-height:1.25;letter-spacing:-.01em;padding-right:30px;display:block}
.c-shop{display:block;font-size:12.5px;color:var(--grau);margin-top:2px}
.c-meta{display:flex;align-items:center;gap:6px;margin-top:9px;flex-wrap:wrap}
.pillet{
  display:inline-flex;align-items:center;gap:4px;background:var(--papier);border-radius:var(--r-pill);
  padding:4px 9px 4px 7px;font-family:var(--mono);font-size:10.5px;color:var(--ink-weich);
}
.pillet .ic{color:var(--grau)}
.pillet.urgent{background:#FFEDE5;color:var(--signal-tief)}
.pillet.urgent .ic{color:var(--signal)}
.c-price{margin-left:auto;display:flex;align-items:baseline;gap:5px;white-space:nowrap;font-family:var(--mono)}
.c-price s{font-size:11px;color:var(--grau)}
.c-price b{font-size:15px;font-weight:700;letter-spacing:-.02em}
.c-quota{margin-top:10px;display:flex;align-items:center;gap:8px}
.bar{flex:1;height:5px;border-radius:var(--r-pill);background:var(--papier-tief);overflow:hidden}
.bar i{display:block;height:100%;border-radius:var(--r-pill);background:var(--grad-emaille)}
.bar i.low{background:var(--grad-signal)}
.c-quota small{font-family:var(--mono);font-size:9.5px;color:var(--grau);letter-spacing:.04em}
.deal-badge{
  position:absolute;top:-8px;left:54px;background:var(--grad-signal);color:#fff;
  font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.04em;
  padding:3px 8px;border-radius:var(--r-pill);box-shadow:var(--sh-signal);
}
.fav-btn{
  position:absolute;top:9px;right:9px;width:34px;height:34px;border-radius:var(--r-pill);border:0;
  background:var(--papier);color:var(--grau);display:grid;place-items:center;
  transition:transform .16s var(--ease),color .16s var(--ease),background .16s var(--ease);
}
.fav-btn:hover{background:var(--papier-tief);color:var(--ink)}
.fav-btn:active{transform:scale(.9)}
.fav-btn.on{color:var(--signal);background:#FFEDE5}

/* ─── Leerzustände & Skeletons ─────────────────────────────────── */
.empty{padding:46px 30px;text-align:center;display:flex;flex-direction:column;align-items:center}
.empty-ic{
  width:62px;height:62px;border-radius:22px;display:grid;place-items:center;margin-bottom:16px;
  background:var(--weiss);border:1px solid var(--linie);color:var(--emaille);box-shadow:var(--sh-1);
}
.empty h3{font-family:var(--display);font-size:21px;text-transform:uppercase;font-weight:400;margin-bottom:7px}
.empty p{color:var(--grau);font-size:13.5px;line-height:1.6;max-width:280px;margin-bottom:16px}
.sk{background:linear-gradient(90deg,var(--papier-tief) 20%,var(--papier) 40%,var(--papier-tief) 60%);background-size:300% 100%;animation:shimmer 1.5s linear infinite;border-radius:8px}
.sk-card{display:flex;gap:12px;background:var(--weiss);border:1px solid var(--linie);border-radius:var(--r-l);padding:13px}
@keyframes shimmer{0%{background-position:150% 0}100%{background-position:-50% 0}}

/* ─── Buttons ──────────────────────────────────────────────────── */
.btn{
  width:100%;display:inline-flex;align-items:center;justify-content:center;gap:8px;
  background:var(--grad-signal);color:#fff;border:0;border-radius:var(--r-m);padding:15px 18px;
  font-size:15px;font-weight:600;letter-spacing:-.01em;box-shadow:var(--sh-signal);
  transition:transform .16s var(--ease),box-shadow .16s var(--ease),filter .16s var(--ease);
}
.btn:hover{filter:saturate(1.06) brightness(1.03)}
.btn:active{transform:translateY(1px) scale(.99)}
.btn.sec{background:var(--weiss);color:var(--ink);border:1.5px solid var(--linie);box-shadow:var(--sh-1)}
.btn.sec:hover{border-color:var(--ink);filter:none}
.btn.ghost{background:transparent;color:var(--emaille);border:1.5px solid transparent;box-shadow:none}
.btn.ghost:hover{background:rgba(27,58,147,.07)}
.btn.blau{background:var(--grad-emaille);box-shadow:var(--sh-emaille)}
.btn:disabled{background:var(--papier-tief);color:var(--grau);box-shadow:none;cursor:default;filter:none;transform:none}
.btn.slim{padding:12px 16px;font-size:14px;border-radius:var(--r-s)}
.link{background:none;border:0;color:var(--emaille);font:inherit;font-size:13.5px;text-decoration:underline;text-underline-offset:3px;padding:8px;align-self:center}
.legal-links{text-align:center;font-size:11.5px;color:var(--grau);letter-spacing:.01em}
.legal-links a{color:var(--grau);text-decoration:underline;text-underline-offset:2px}
.legal-links a:hover{color:var(--ink)}
.hint{font-family:var(--mono);font-size:10.5px;color:var(--grau);text-align:center;margin-top:9px;letter-spacing:.02em}

/* ─── Tab-Navigation ──────────────────────────────────────────── */
.tabs{
  flex:none;display:flex;gap:4px;padding:8px 10px calc(8px + env(safe-area-inset-bottom));
  background:rgba(255,255,255,.9);border-top:1px solid var(--linie);backdrop-filter:blur(14px);
}
.tab{
  flex:1;background:none;border:0;padding:7px 2px 6px;border-radius:var(--r-m);
  display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--grau);
  transition:color .18s var(--ease),background .18s var(--ease);
}
.tab span{font-size:10px;font-weight:500;letter-spacing:.01em}
.tab-ic{width:34px;height:30px;border-radius:var(--r-pill);display:grid;place-items:center;transition:background .22s var(--ease),transform .22s var(--ease),color .18s var(--ease)}
.tab:hover{color:var(--ink-weich)}
.tab.on{color:var(--ink)}
.tab.on .tab-ic{background:var(--grad-emaille);color:#fff;transform:translateY(-1px);box-shadow:var(--sh-emaille)}

/* ─── Sheets / Overlays ───────────────────────────────────────── */
.overlay{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center;background:rgba(12,15,18,.52);backdrop-filter:blur(3px);animation:fade .22s var(--ease)}
.sheet{
  width:100%;max-width:480px;max-height:92vh;background:var(--grad-papier);
  border-radius:var(--r-xl) var(--r-xl) 0 0;display:flex;flex-direction:column;overflow:hidden;
  box-shadow:0 -20px 60px -20px rgba(12,15,18,.5);animation:slideup .3s var(--ease);
}
.grip{flex:none;padding:9px 0 3px;display:grid;place-items:center}
.grip i{width:42px;height:4px;border-radius:var(--r-pill);background:var(--linie)}
.sheet-scroll{flex:1;overflow-y:auto}
.sheet-foot{flex:none;padding:12px 16px calc(16px + env(safe-area-inset-bottom));background:var(--weiss);border-top:1px solid var(--linie)}
.sheet-pad{padding:4px 18px 20px}
.sheet-pad h2{font-size:21px;font-weight:600;letter-spacing:-.02em;margin-bottom:8px}
.sheet-pad p{font-size:14.5px;color:var(--ink-weich);line-height:1.6}
.sheet-ic{width:56px;height:56px;border-radius:20px;display:grid;place-items:center;margin-bottom:14px;background:var(--grad-emaille);color:#fff;box-shadow:var(--sh-emaille);position:relative;overflow:hidden}
.sheet-ic::after{content:"";position:absolute;inset:0;background:var(--glanz)}
.opt-list{display:flex;flex-direction:column;gap:8px;padding:2px 18px 22px}
.opt{
  display:flex;align-items:center;gap:12px;width:100%;text-align:left;font:inherit;
  background:var(--weiss);border:1.5px solid var(--linie);border-radius:var(--r-m);padding:14px;
  transition:border-color .16s var(--ease),transform .16s var(--ease);
}
.opt:hover{border-color:var(--grau)}
.opt:active{transform:scale(.99)}
.opt.on{border-color:var(--emaille);background:linear-gradient(135deg,rgba(46,88,204,.07),rgba(27,58,147,.03))}
.opt strong{font-size:15px;font-weight:600}
.opt small{display:block;font-family:var(--mono);font-size:10.5px;color:var(--grau);margin-top:2px}
.opt .tick{margin-left:auto;color:var(--emaille)}
@keyframes slideup{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes fade{from{opacity:0}to{opacity:1}}

/* ─── Deal-Detail ─────────────────────────────────────────────── */
.d-hero{height:168px;position:relative;display:grid;place-items:center;overflow:hidden}
.d-hero::after{content:"";position:absolute;inset:0;background:linear-gradient(165deg,rgba(255,255,255,.26),rgba(0,0,0,.18))}
.d-hero .init{position:relative;z-index:1;font-family:var(--display);font-size:60px;color:rgba(255,255,255,.94);text-shadow:0 6px 24px rgba(0,0,0,.25)}
.d-hero .cat-tag{position:absolute;z-index:1;bottom:14px;left:16px;background:rgba(255,255,255,.92);border-radius:var(--r-pill);padding:5px 11px;font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink)}
.glass{
  position:absolute;z-index:2;top:14px;width:38px;height:38px;border-radius:var(--r-pill);border:0;
  background:rgba(255,255,255,.9);color:var(--ink);display:grid;place-items:center;
  box-shadow:0 4px 14px -6px rgba(0,0,0,.4);transition:transform .16s var(--ease)
}
.glass:active{transform:scale(.92)}
.glass.left{left:14px}
.glass.right{right:14px;color:var(--grau)}
.glass.right.on{color:var(--signal)}
.d-body{padding:16px 18px 22px}
.d-body h2{font-size:24px;font-weight:600;line-height:1.2;letter-spacing:-.02em;margin:8px 0 14px}
.d-shop{font-size:13px;color:var(--grau)}
.price-box{display:flex;align-items:center;gap:10px;background:var(--weiss);border:1px solid var(--linie);border-radius:var(--r-m);padding:14px;box-shadow:var(--sh-1)}
.price-box .big{font-family:var(--display);font-size:34px;line-height:1;letter-spacing:.01em}
.price-box s{font-family:var(--mono);font-size:14px;color:var(--grau)}
.price-box .pct{margin-left:auto;background:var(--grad-signal);color:#fff;font-family:var(--mono);font-size:12px;font-weight:700;padding:6px 10px;border-radius:var(--r-pill);box-shadow:var(--sh-signal)}
.facts{display:flex;gap:8px;margin:12px 0 16px}
.fact{flex:1;background:var(--weiss);border:1px solid var(--linie);border-radius:var(--r-m);padding:11px 8px;text-align:center;box-shadow:var(--sh-1)}
.fact b{display:block;font-family:var(--mono);font-size:15px;font-weight:700;letter-spacing:-.02em}
.fact b.urgent{color:var(--signal)}
.fact span{display:block;margin-top:3px;font-family:var(--mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--grau)}
.terms-title{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--grau);margin-bottom:8px}
.terms{list-style:none;display:flex;flex-direction:column;gap:7px}
.terms li{display:flex;gap:8px;font-size:13.5px;color:var(--ink-weich);line-height:1.5}
.terms li .ic{color:var(--gruen);margin-top:2px}

/* ─── Gutschein-Bon ───────────────────────────────────────────── */
.bon{position:relative;margin:0 16px 16px;background:var(--weiss);border-radius:var(--r-l);box-shadow:var(--sh-1);overflow:hidden}
.bon-top{background:var(--grad-emaille);color:#fff;padding:13px 16px;display:flex;align-items:center;gap:10px;position:relative;overflow:hidden}
.bon-top::after{content:"";position:absolute;inset:0;background:var(--glanz)}
.bon-top .who{position:relative;z-index:1;flex:1;min-width:0}
.bon-top strong{display:block;font-size:14.5px;font-weight:600}
.bon-top small{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.72)}
.state{position:relative;z-index:1;font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.3);border-radius:var(--r-pill);padding:4px 9px}
.perf{position:relative;height:16px;background:var(--weiss)}
.perf::before,.perf::after{content:"";position:absolute;top:0;width:16px;height:16px;border-radius:50%;background:var(--pflaster);transform:translateY(-50%)}
.perf::before{left:-8px}
.perf::after{right:-8px}
.perf i{position:absolute;left:14px;right:14px;top:50%;border-top:1.5px dashed var(--linie)}
.bon-in{padding:2px 16px 16px}
.bon-in h3{font-size:16.5px;font-weight:600;letter-spacing:-.01em}
.bon-in .addr{font-family:var(--mono);font-size:11px;color:var(--grau);margin-top:4px}
.bon-timer{display:flex;justify-content:space-between;align-items:center;margin:12px 0;padding:10px 12px;background:var(--papier);border-radius:var(--r-s);font-family:var(--mono);font-size:11px;color:var(--grau)}
.bon-timer b{font-size:15px;color:var(--ink);letter-spacing:.02em}
.bon-timer b.urgent{color:var(--signal)}
.code-area{text-align:center;padding:6px 0 2px}
.digits{font-family:var(--mono);font-size:27px;font-weight:700;letter-spacing:.26em;text-indent:.26em;color:var(--ink)}
.barcode{height:42px;display:flex;gap:2px;align-items:stretch;justify-content:center;margin-top:10px}
.barcode i{display:block;background:var(--ink);border-radius:1px}
.bon .note{text-align:center;font-family:var(--mono);font-size:10px;letter-spacing:.05em;color:var(--grau);margin-top:12px}
.bon.used{opacity:.62}
.bon.used .bon-top{background:var(--grad-ink)}
.stamp{position:absolute;right:18px;top:78px;z-index:2;transform:rotate(-8deg);border:2.5px solid var(--grau);color:var(--grau);font-family:var(--display);font-size:18px;text-transform:uppercase;padding:3px 9px;letter-spacing:.06em;border-radius:6px;opacity:.85}

/* ─── Auth / Formulare ────────────────────────────────────────── */
.auth-page{min-height:100%;padding:38px 22px calc(28px + env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative}
.auth-page::before{content:"";position:absolute;inset:0;background:radial-gradient(520px 320px at 50% 0%,rgba(46,88,204,.13),rgba(46,88,204,0) 70%),radial-gradient(420px 300px at 90% 100%,rgba(255,74,15,.1),rgba(255,74,15,0) 70%);pointer-events:none}
.brand{position:relative;width:66px;height:66px;border-radius:24px;display:grid;place-items:center;background:var(--grad-emaille);color:#fff;font-family:var(--display);font-size:30px;box-shadow:var(--sh-emaille);overflow:hidden;margin-bottom:18px}
.brand::after{content:"";position:absolute;inset:0;background:var(--glanz)}
.brand span{position:relative;z-index:1}
.auth-page h1{position:relative;font-family:var(--display);font-size:38px;text-transform:uppercase;font-weight:400;letter-spacing:.01em;text-align:center;line-height:1.05}
.auth-page .tagline{position:relative;font-size:13.5px;color:var(--grau);margin-top:6px;margin-bottom:24px;text-align:center;max-width:300px;line-height:1.5}
.auth-box{position:relative;width:100%;max-width:360px;display:flex;flex-direction:column;gap:12px}
.panel{background:var(--weiss);border:1px solid var(--linie);border-radius:var(--r-l);padding:16px;box-shadow:var(--sh-1);display:flex;flex-direction:column;gap:12px}
.field{display:flex;flex-direction:column;gap:6px}
.field > label{font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--grau)}
.field input,.field select,.field textarea{
  width:100%;border:1.5px solid var(--linie);border-radius:var(--r-s);padding:13px 14px;
  font-size:15px;background:var(--papier);color:var(--ink);outline:0;
  transition:border-color .16s var(--ease),background .16s var(--ease),box-shadow .16s var(--ease);
}
.field textarea{resize:vertical;line-height:1.5}
.field input:hover,.field select:hover,.field textarea:hover{border-color:#C3BFB4}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--emaille);background:var(--weiss);box-shadow:0 0 0 4px rgba(27,58,147,.1)}
.field select{appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='20' height='20' viewBox='0 0 24 24' fill='none' stroke='%237A766E' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M6.5 9.5 12 15l5.5-5.5'/></svg>");background-repeat:no-repeat;background-position:right 12px center;padding-right:40px}
.field .with-ic{position:relative;display:flex;align-items:center}
.field .with-ic .lead{position:absolute;left:13px;color:var(--grau);pointer-events:none}
.field .with-ic input{padding-left:41px}
.field .with-ic .trail{position:absolute;right:6px;width:34px;height:34px;border-radius:var(--r-s);border:0;background:none;color:var(--grau);display:grid;place-items:center}
.field .with-ic .trail:hover{background:var(--papier-tief);color:var(--ink)}
.field .with-ic:has(.trail) input{padding-right:44px}
.field .row{display:flex;gap:10px}
.counter{font-family:var(--mono);font-size:10px;color:var(--grau);text-align:right}
.seg{display:flex;gap:4px;background:var(--papier);border:1px solid var(--linie);border-radius:var(--r-s);padding:4px}
.seg button{
  flex:1;display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;background:none;
  border-radius:8px;padding:10px 8px;font-size:13.5px;font-weight:500;color:var(--grau);
  transition:background .18s var(--ease),color .18s var(--ease),box-shadow .18s var(--ease);
}
.seg button.on{background:var(--weiss);color:var(--ink);font-weight:600;box-shadow:var(--sh-1)}
.err{display:flex;gap:9px;align-items:flex-start;background:#FDECE7;border:1px solid #F3B7A2;color:#8C2C0B;padding:12px 13px;font-size:13.5px;line-height:1.45;border-radius:var(--r-s)}
.err .ic{margin-top:1px;flex:none}
.demo-row{display:flex;gap:8px}
.demo-btn{flex:1;background:var(--weiss);border:1px dashed var(--linie);border-radius:var(--r-s);padding:10px;text-align:left;font:inherit}
.demo-btn:hover{border-color:var(--emaille);border-style:solid}
.demo-btn strong{display:block;font-size:12.5px;font-weight:600}
.demo-btn small{font-family:var(--mono);font-size:10px;color:var(--grau)}

/* ─── Onboarding ──────────────────────────────────────────────── */
.onb{padding:20px 16px 0}
.onb-head{display:flex;gap:13px;align-items:center;margin-bottom:18px}
.onb-head h1{font-family:var(--display);font-size:25px;text-transform:uppercase;font-weight:400;line-height:1.08;letter-spacing:.01em}
.onb-head p{font-size:13px;color:var(--grau);line-height:1.5;margin-top:4px}
.step{display:flex;flex-direction:column;gap:12px;background:var(--weiss);border:1px solid var(--linie);border-radius:var(--r-l);padding:16px;box-shadow:var(--sh-1);margin-bottom:12px}
.step-head{display:flex;align-items:center;gap:10px}
.step-no{width:26px;height:26px;flex:none;border-radius:var(--r-pill);display:grid;place-items:center;background:var(--grad-emaille);color:#fff;font-family:var(--mono);font-size:12px;font-weight:700;box-shadow:var(--sh-emaille)}
.step-head h3{font-size:15.5px;font-weight:600;letter-spacing:-.01em}
.step-head small{display:block;font-size:12px;color:var(--grau);font-weight:400;margin-top:1px}
.ava-preview{display:flex;align-items:center;gap:12px;background:var(--papier);border-radius:var(--r-m);padding:11px}
.ava-preview .ava{width:46px;height:46px;font-size:17px;border-radius:15px}
.ava-preview .txt{font-size:12px;color:var(--grau);line-height:1.45}
.ava-preview .txt b{display:block;color:var(--ink);font-size:13px}
.geo-box{display:flex;align-items:center;gap:12px;background:linear-gradient(135deg,rgba(27,122,61,.1),rgba(27,122,61,.03));border:1.5px solid rgba(27,122,61,.35);border-radius:var(--r-m);padding:13px}
.geo-box .ic{color:var(--gruen)}
.geo-box .coords{flex:1;font-family:var(--mono);font-size:13px}
.geo-box .coords small{display:block;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--gruen);margin-bottom:2px}
.mini-btn{background:var(--weiss);border:1px solid var(--linie);border-radius:var(--r-s);padding:8px 12px;font:inherit;font-size:12.5px;font-weight:500;color:var(--ink)}
.mini-btn:hover{border-color:var(--ink)}
.divider{display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--grau)}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--linie)}
.tip{display:flex;gap:9px;background:var(--papier);border-radius:var(--r-s);padding:11px 12px;font-size:12.5px;color:var(--ink-weich);line-height:1.5}
.tip .ic{color:var(--emaille);flex:none;margin-top:1px}
.sticky-foot{position:sticky;bottom:0;padding:12px 16px calc(14px + env(safe-area-inset-bottom));background:linear-gradient(180deg,rgba(245,243,237,0),var(--papier) 40%)}

/* ─── Suche ───────────────────────────────────────────────────── */
.search-bar{position:sticky;top:0;z-index:5;padding:14px 16px 10px;background:linear-gradient(180deg,var(--papier) 70%,rgba(245,243,237,0));backdrop-filter:blur(8px)}
.search-inner{display:flex;align-items:center;gap:10px;background:var(--weiss);border:1.5px solid var(--linie);border-radius:var(--r-pill);padding:12px 16px;box-shadow:var(--sh-1);transition:border-color .16s var(--ease),box-shadow .16s var(--ease)}
.search-inner:focus-within{border-color:var(--emaille);box-shadow:0 0 0 4px rgba(27,58,147,.1)}
.search-inner input{flex:1;min-width:0;border:0;outline:0;background:none;font-size:15px}
.search-inner .ic{color:var(--grau)}
.search-inner .clear{width:26px;height:26px;border-radius:var(--r-pill);border:0;background:var(--papier-tief);color:var(--ink);display:grid;place-items:center}
.section-title{font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--grau);padding:14px 16px 8px}
.cat-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;padding:0 16px 10px}
.cat-tile{display:flex;gap:11px;align-items:center;text-align:left;font:inherit;background:var(--weiss);border:1px solid var(--linie);border-radius:var(--r-m);padding:13px;box-shadow:var(--sh-1);transition:transform .16s var(--ease),border-color .16s var(--ease)}
.cat-tile:hover{border-color:var(--ink);transform:translateY(-1px)}
.cat-dot{width:34px;height:34px;flex:none;border-radius:12px;display:grid;place-items:center;color:#fff;font-family:var(--display);font-size:14px;position:relative;overflow:hidden}
.cat-dot::after{content:"";position:absolute;inset:0;background:var(--glanz)}
.cat-tile strong{display:block;font-size:13.5px;font-weight:600;line-height:1.25}
.cat-tile small{font-family:var(--mono);font-size:10px;color:var(--grau)}

/* ─── Favoriten ───────────────────────────────────────────────── */
.info-note{display:flex;gap:9px;margin:14px 16px 4px;padding:12px 13px;background:var(--weiss);border:1px solid var(--linie);border-radius:var(--r-m);font-size:12.5px;color:var(--ink-weich);line-height:1.5;box-shadow:var(--sh-1)}
.info-note .ic{color:var(--emaille);flex:none;margin-top:1px}
.fav-list{padding:10px 16px 6px;display:flex;flex-direction:column;gap:9px}
.fav-row{display:flex;align-items:center;gap:12px;background:var(--weiss);border:1px solid var(--linie);border-radius:var(--r-m);padding:11px;box-shadow:var(--sh-1)}
.fav-row .ava{width:44px;height:44px;font-size:15px;border-radius:15px}
.fav-info{flex:1;min-width:0;text-align:left;background:none;border:0;font:inherit;padding:0}
.fav-info strong{display:block;font-size:14px;font-weight:600}
.fav-info small{display:block;font-size:12px;color:var(--grau);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fav-info small.live{color:var(--signal);font-weight:500}
.icon-btn{width:36px;height:36px;flex:none;border-radius:var(--r-pill);border:1px solid var(--linie);background:var(--papier);color:var(--grau);display:grid;place-items:center;transition:color .16s var(--ease),border-color .16s var(--ease)}
.icon-btn:hover{color:var(--signal);border-color:var(--signal)}

/* ─── Händler ─────────────────────────────────────────────────── */
.m-seg{padding:14px 16px 4px}
.m-stats{display:grid;grid-template-columns:1fr 1fr;gap:9px;padding:12px 16px}
.m-stat{position:relative;background:var(--weiss);border:1px solid var(--linie);border-radius:var(--r-m);padding:14px;box-shadow:var(--sh-1);overflow:hidden}
.m-stat::after{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--grad-emaille)}
.m-stat.hot::after{background:var(--grad-signal)}
.m-stat b{display:block;font-family:var(--display);font-size:29px;line-height:1;letter-spacing:.01em}
.m-stat span{display:block;margin-top:5px;font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--grau)}
.m-offers{padding:0 16px 14px;display:flex;flex-direction:column;gap:9px}
.m-offer{display:flex;align-items:center;gap:12px;background:var(--weiss);border:1px solid var(--linie);border-radius:var(--r-m);padding:13px;box-shadow:var(--sh-1)}
.m-offer .txt{flex:1;min-width:0}
.m-offer h4{font-size:14.5px;font-weight:600;letter-spacing:-.01em}
.m-offer small{display:block;font-family:var(--mono);font-size:10.5px;color:var(--grau);margin-top:4px}
.st{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;padding:6px 10px;border-radius:var(--r-pill);border:1px solid transparent;font-weight:500}
.st.active{background:var(--gruen-weich);color:var(--gruen);border-color:rgba(27,122,61,.25)}
.st.paused{background:var(--gelb-weich);color:var(--gelb);border-color:rgba(178,107,0,.25)}
.st.expired{background:var(--papier);color:var(--grau);border-color:var(--linie)}
.form-wrap{padding:14px 16px 20px;display:flex;flex-direction:column;gap:12px}
.form-wrap h3,.scanner h3{font-family:var(--display);font-size:22px;text-transform:uppercase;font-weight:400;letter-spacing:.01em}
.scanner{padding:22px 16px;text-align:center;display:flex;flex-direction:column;align-items:center}
.scanner p{color:var(--grau);font-size:13.5px;margin:8px 0 18px;max-width:260px;line-height:1.55}
.code-input{
  width:100%;max-width:290px;border:2px solid var(--ink);border-radius:var(--r-m);padding:16px;
  font-family:var(--mono);font-size:26px;font-weight:700;text-align:center;letter-spacing:.24em;
  text-indent:.24em;text-transform:uppercase;outline:0;background:var(--weiss);margin-bottom:14px;
  box-shadow:var(--sh-1);transition:border-color .16s var(--ease),box-shadow .16s var(--ease);
}
.code-input:focus{border-color:var(--signal);box-shadow:0 0 0 4px rgba(255,74,15,.14)}
.scan-result{display:flex;gap:10px;align-items:flex-start;text-align:left;max-width:290px;margin-top:16px;padding:14px;border-radius:var(--r-m);font-size:13.5px;line-height:1.5}
.scan-result.ok{background:var(--gruen-weich);border:1px solid rgba(27,122,61,.35);color:#14602F}
.scan-result.err{background:#FDECE7;border:1px solid #F3B7A2;color:#8C2C0B}
.scan-result.dup{background:var(--gelb-weich);border:1px solid rgba(178,107,0,.35);color:#8A5300}
.pending-banner{margin:12px 16px 0;padding:14px 16px;border-radius:var(--r-m);background:var(--gelb-weich);border:1px solid rgba(178,107,0,.35);display:flex;gap:12px;align-items:flex-start;font-size:13.5px;line-height:1.5;color:#5C3A00}
.pending-banner strong{display:block;font-size:14px;margin-bottom:2px;color:var(--ink)}
.m-subseg{display:flex;gap:6px;padding:0 16px 10px;flex-wrap:wrap}
.m-subseg button{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;padding:7px 12px;border-radius:var(--r-pill);border:1px solid var(--linie);background:var(--weiss);color:var(--grau)}
.m-subseg button.on{background:var(--emaille);border-color:var(--emaille);color:#fff}
.vch-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 13px;background:var(--weiss);border:1px solid var(--linie);border-radius:var(--r-m);font-size:13px}
.vch-row code{font-family:var(--mono);font-weight:600;letter-spacing:.12em}
.shop-hero{margin:0 16px 14px;padding:18px;border-radius:var(--r-l);background:var(--weiss);border:1px solid var(--linie);box-shadow:var(--sh-1)}
.shop-hero .init{width:56px;height:56px;border-radius:18px;display:grid;place-items:center;font-family:var(--display);font-size:22px;color:#fff;margin-bottom:12px}
.shop-hero h2{font-family:var(--display);font-size:24px;text-transform:uppercase;font-weight:400;line-height:1.05}
.shop-hero .addr{margin-top:8px;font-size:14px;color:var(--ink-weich)}
.shop-hero .desc{margin-top:10px;font-size:13.5px;color:var(--grau);line-height:1.55}
.shop-link{display:inline-flex;align-items:center;gap:6px;margin-top:12px;font-size:13px;font-weight:600;color:var(--emaille);background:none;border:none;padding:0}
.admin-list{padding:12px 16px 20px;display:flex;flex-direction:column;gap:10px}
.admin-card{background:var(--weiss);border:1px solid var(--linie);border-radius:var(--r-m);padding:14px;box-shadow:var(--sh-1)}
.admin-card h4{font-size:15px;font-weight:600}
.admin-card small{display:block;margin-top:4px;font-size:12.5px;color:var(--grau);line-height:1.45}
.admin-actions{display:flex;gap:8px;margin-top:12px}
.admin-actions .btn{flex:1;padding:10px;font-size:13px}
.admin-actions .btn.sec{flex:0 0 auto}

/* ─── Push-Banner ─────────────────────────────────────────────── */
.push-banner{
  position:fixed;top:calc(10px + env(safe-area-inset-top));left:50%;z-index:30;width:calc(100% - 20px);max-width:452px;
  transform:translateX(-50%) translateY(-140%);display:flex;gap:11px;align-items:center;text-align:left;
  background:rgba(255,255,255,.96);border:1px solid rgba(255,255,255,.6);border-radius:18px;padding:12px;
  box-shadow:0 18px 44px -14px rgba(12,15,18,.5);backdrop-filter:blur(16px);
  transition:transform .4s var(--ease);font:inherit;
}
.push-banner.show{transform:translateX(-50%) translateY(0)}
.push-ic{width:36px;height:36px;flex:none;border-radius:11px;display:grid;place-items:center;background:var(--grad-emaille);color:#fff;position:relative;overflow:hidden}
.push-ic::after{content:"";position:absolute;inset:0;background:var(--glanz)}
.push-body{flex:1;min-width:0}
.push-body .app-name{font-family:var(--mono);font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--grau)}
.push-body .msg{font-size:13.5px;font-weight:600;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.push-body .sub{font-family:var(--mono);font-size:10.5px;color:var(--grau);margin-top:2px}

.loading{text-align:center;padding:44px;color:var(--grau);font-size:14px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<body>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>
<script type="text/babel">
const { useState, useEffect, useCallback, useRef, createContext, useContext } = React;

// ─── API ────────────────────────────────────────────────────────────
const API = '';
const getToken = () => localStorage.getItem('nahdran_token');
const api = async (path, opts = {}) => {
  const token = getToken();
  const headers = { 'Content-Type': 'application/json', ...(token ? { Authorization: `Bearer ${token}` } : {}) };
  const res = await fetch(API + path, { ...opts, headers });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || 'Fehler');
  return data;
};

// ─── Context ────────────────────────────────────────────────────────
const AppCtx = createContext();

// ─── Helpers ────────────────────────────────────────────────────────
const euro = v => parseFloat(v).toLocaleString('de-DE', { minimumFractionDigits: 2 }) + ' €';
const walkMin = m => Math.max(1, Math.round(m / 75)) + ' Min.';
// ab einem Kilometer lesbarer in km statt vierstelliger Meterzahl
const dist = m => m < 1000
  ? Math.round(m) + ' m'
  : (m / 1000).toLocaleString('de-DE', { maximumFractionDigits: m < 10000 ? 1 : 0 }) + ' km';
const timeLeft = iso => {
  const ms = new Date(iso).getTime() - Date.now();
  if (ms <= 0) return { text: 'abgelaufen', urgent: true };
  const s = Math.floor(ms / 1000), h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
  return {
    text: h > 0 ? `${h}:${String(m).padStart(2, '0')} Std.` : `${m}:${String(sec).padStart(2, '0')} Min.`,
    urgent: ms < 30 * 60000
  };
};
const pct = (pb, pa) => pa != null ? Math.round((1 - parseFloat(pa) / parseFloat(pb)) * 100) : 100;
const barcode = code => {
  const bars = [];
  for (let i = 0; i < 48; i++) {
    const w = 1 + ((code.charCodeAt(i % code.length) + i * 7) % 4);
    bars.push(<i key={i} style={{ width: w, opacity: i % 3 === 0 ? .25 : 1 }} />);
  }
  return bars;
};
// Verlauf aus der Kategoriefarbe: gleicher Ton, nach unten rechts aufgehellt
const lighten = (hex, amount) => {
  const h = hex.replace('#', '');
  const n = parseInt(h.length === 3 ? h.split('').map(c => c + c).join('') : h, 16);
  const mix = v => Math.round(v + (255 - v) * amount);
  return '#' + [mix(n >> 16 & 255), mix(n >> 8 & 255), mix(n & 255)]
    .map(v => v.toString(16).padStart(2, '0')).join('');

function Icon({ name, size = 20, stroke = 1.7, fill = 'none', style, className }) {
  return (
    <svg className={'ic' + (className ? ' ' + className : '')} style={style} width={size} height={size}
      viewBox="0 0 24 24" fill={fill} stroke="currentColor" strokeWidth={stroke}

      {ICONS[name]}
    </svg>
  );
}

// ─── Auth Screen ────────────────────────────────────────────────────
function AuthScreen() {
  const { setUser, setMerchant } = useContext(AppCtx);
  const [mode, setMode] = useState('login');
  const [email, setEmail] = useState('kunde@demo.de');
  const [pw, setPw] = useState('demo123');
  const [showPw, setShowPw] = useState(false);
  const [name, setName] = useState('');
  const [role, setRole] = useState('consumer');
  const [err, setErr] = useState('');
  const [loading, setLoading] = useState(false);

  const submit = async () => {
    setErr(''); setLoading(true);
    try {
      const data = mode === 'login'
        ? await api('/api/auth/login', { method: 'POST', body: JSON.stringify({ email, password: pw }) })
        : await api('/api/auth/register', { method: 'POST', body: JSON.stringify({ email, password: pw, name, role }) });
      localStorage.setItem('nahdran_token', data.token);
      if (data.user.role === 'merchant') {
        const me = await api('/api/auth/me');
        setMerchant(me.merchant || null);
      }
      setUser(data.user);
    } catch (e) { setErr(e.message); }
    setLoading(false);
  };

  const fillDemo = (mail) => {
    setMode('login');
    setEmail(mail);
    setPw(mail === 'admin@50meter.de' ? 'admin50meter' : 'demo123');
    setErr('');
  };

  return (
    <div className="auth-page">
      <div className="brand"><span>N</span></div>
      <h1>Nahdran</h1>
      <div className="tagline">Deals in Laufweite. Jetzt.</div>

      <div className="auth-box">
        {err && <div className="err"><Icon name="alert" size={17} /><span>{err}</span></div>}

        <div className="panel">
          {mode === 'register' && (
            <>
              <div className="field">
                <label>Name</label>
                <div className="with-ic">
                  <span className="lead"><Icon name="user" size={18} /></span>
                  <input value={name} onChange={e => setName(e.target.value)} placeholder="Dein Name" />
                </div>
              </div>
              <div className="field">
                <label>Ich bin</label>
                <div className="seg" role="group" aria-label="Rolle wählen">
                  <button type="button" className={role === 'consumer' ? 'on' : ''} onClick={() => setRole('consumer')}>
                    <Icon name="user" size={16} />Kunde
                  </button>
                  <button type="button" className={role === 'merchant' ? 'on' : ''} onClick={() => setRole('merchant')}>
                    <Icon name="store" size={16} />Händler
                  </button>
                </div>
              </div>
            </>
          )}

          <div className="field">
            <label>E-Mail</label>
            <div className="with-ic">
              <span className="lead"><Icon name="mail" size={18} /></span>
              <input type="email" value={email} onChange={e => setEmail(e.target.value)} placeholder="mail@beispiel.de" />
            </div>
          </div>

          <div className="field">
            <label>Passwort</label>
            <div className="with-ic">
              <span className="lead"><Icon name="lock" size={18} /></span>
              <input type={showPw ? 'text' : 'password'} value={pw} onChange={e => setPw(e.target.value)}
                placeholder="min. 6 Zeichen" onKeyDown={e => e.key === 'Enter' && submit()} />
              <button type="button" className="trail" onClick={() => setShowPw(s => !s)}
                aria-label={showPw ? 'Passwort verbergen' : 'Passwort anzeigen'}>
                <Icon name={showPw ? 'eyeOff' : 'eye'} size={18} />
              </button>
            </div>
          </div>

          <button className="btn" onClick={submit} disabled={loading}>
            {loading ? 'Einen Moment...' : mode === 'login' ? 'Anmelden' : 'Konto erstellen'}
            {!loading && <Icon name="chevronRight" size={18} />}
          </button>
        </div>

        <button className="link" onClick={() => { setMode(mode === 'login' ? 'register' : 'login'); setErr(''); }}>
          {mode === 'login' ? 'Noch kein Konto? Registrieren' : 'Schon registriert? Anmelden'}
        </button>

        {mode === 'login' && (
          <div className="demo-row">
            <button className="demo-btn" onClick={() => fillDemo('kunde@demo.de')}>
              <strong>Demo: Kunde</strong><small>kunde@demo.de</small>
            </button>
            <button className="demo-btn" onClick={() => fillDemo('cafe@demo.de')}>
              <strong>Demo: Händler</strong><small>cafe@demo.de</small>
            </button>
            <button className="demo-btn" onClick={() => fillDemo('admin@50meter.de')}>
              <strong>Demo: Admin</strong><small>admin@50meter.de</small>
            </button>
          </div>
        )}

        <div className="legal-links">
          <a href="/impressum" target="_blank" rel="noopener noreferrer">Impressum</a>
          {' · '}
          <a href="/datenschutz" target="_blank" rel="noopener noreferrer">Datenschutz</a>
        </div>
      </div>
    </div>
  );
}

// ─── Deal Card ──────────────────────────────────────────────────────
function DealCard({ offer, onOpen, onFav }) {
  const [tl, setTl] = useState(timeLeft(offer.ends_at));
  useEffect(() => { const i = setInterval(() => setTl(timeLeft(offer.ends_at)), 1000); return () => clearInterval(i); }, [offer.ends_at]);

  const left = offer.quota_remaining, total = offer.quota_total;
  const share = Math.max(4, Math.round(left / total * 100));
  const low = left / total <= .25;

  return (
    <button className="card" onClick={() => onOpen(offer.id)}>
      <span className="deal-badge">{offer.price_after != null ? `−${pct(offer.price_before, offer.price_after)} %` : 'gratis'}</span>
      <span className="ava" style={{ background: catGrad(offer.category_color) }}><span>{offer.merchant_short}</span></span>
      <span className="c-body">
        <span className="c-top"><span className="c-cat">{offer.category_label}</span></span>
        <h3>{offer.title}</h3>
        <span className="c-shop" onClick={e => { if (offer.merchant_slug) { e.stopPropagation(); window.dispatchEvent(new CustomEvent('nahdran:shop', { detail: offer.merchant_slug })); } }}>
          {offer.merchant_name} · Nr. {offer.house_number || '–'}
        </span>
        <span className="c-meta">
          <span className="pillet"><Icon name="pin" size={13} />{dist(offer.distance)}</span>
          <span className={`pillet${tl.urgent ? ' urgent' : ''}`}><Icon name="clock" size={13} />{tl.text}</span>
          <span className="c-price">
            {offer.price_after != null
              ? <><s>{euro(offer.price_before)}</s><b>{euro(offer.price_after)}</b></>
              : <b>gratis</b>}
          </span>
        </span>
        <span className="c-quota">
          <span className="bar"><i className={low ? 'low' : ''} style={{ width: share + '%' }} /></span>
          <small>{left} von {total} frei</small>
        </span>
      </span>
      {onFav && (
        <span className={`fav-btn${offer.is_favourite ? ' on' : ''}`} role="button"
          aria-label={offer.is_favourite ? 'Favorit entfernen' : 'Als Favorit merken'}
          onClick={e => { e.stopPropagation(); onFav(offer); }}>
          <Icon name="heart" size={17} fill={offer.is_favourite ? 'currentColor' : 'none'} />
        </span>
      )}
    </button>
  );
}

// ─── Deal Detail Sheet ──────────────────────────────────────────────
function DealSheet({ offerId, onClose }) {
  const { refresh, geo } = useContext(AppCtx);
  const [o, setO] = useState(null);
  const [saving, setSaving] = useState(false);
  const [tl, setTl] = useState(null);

  useEffect(() => { if (offerId) api(`/api/offers/${offerId}`).then(setO).catch(() => {}); }, [offerId]);
  useEffect(() => { if (!o) return; const i = setInterval(() => setTl(timeLeft(o.ends_at)), 1000); setTl(timeLeft(o.ends_at)); return () => clearInterval(i); }, [o]);

  const secure = async () => {
    setSaving(true);
    try { await api('/api/vouchers', { method: 'POST', body: JSON.stringify({ offerId }) }); refresh(); onClose('gutscheine'); }
    catch (e) { alert(e.message); }
    setSaving(false);
  };

  const toggleFav = async () => {
    if (o.is_favourite) { await api(`/api/favourites/${o.merchant_id}`, { method: 'DELETE' }); setO({ ...o, is_favourite: false }); }
    else { await api('/api/favourites', { method: 'POST', body: JSON.stringify({ merchantId: o.merchant_id }) }); setO({ ...o, is_favourite: true }); }
    refresh();
  };

  if (!o || !tl) return null;
  // Die Detail-Route liefert keine Entfernung mit, deshalb hier aus den Koordinaten
  const distance = Math.round(haversineJS(geo.lat, geo.lng, o.mlat, o.mlng));
  return (
    <div className="overlay" onClick={e => e.target === e.currentTarget && onClose()}>
      <div className="sheet" role="dialog" aria-modal="true" aria-label={o.title}>
        <div className="sheet-scroll">
          <div className="d-hero" style={{ background: catGrad(o.category_color) }}>
            <span className="init">{o.merchant_short}</span>
            <button className="glass left" onClick={() => onClose()} aria-label="Schließen"><Icon name="close" size={18} /></button>
            <button className={`glass right${o.is_favourite ? ' on' : ''}`} onClick={toggleFav}
              aria-label={o.is_favourite ? 'Favorit entfernen' : 'Als Favorit merken'}>
              <Icon name="heart" size={18} fill={o.is_favourite ? 'currentColor' : 'none'} />
            </button>
            <span className="cat-tag">{o.category_label}</span>
          </div>

          <div className="d-body">
            <div className="d-shop">
              {o.merchant_slug
                ? <button type="button" className="shop-link" onClick={() => { onClose(); window.dispatchEvent(new CustomEvent('nahdran:shop', { detail: o.merchant_slug })); }}>
                    {o.merchant_name} · {o.street} {o.house_number || '–'}
                    <Icon name="chevronRight" size={16} />
                  </button>
                : <>{o.merchant_name} · {o.street} {o.house_number || '–'}</>}
            </div>
            <h2>{o.title}</h2>

            <div className="price-box">
              {o.price_after != null
                ? <><span className="big">{euro(o.price_after)}</span><s>{euro(o.price_before)}</s><span className="pct">−{pct(o.price_before, o.price_after)} %</span></>
                : <><span className="big">gratis</span><s>{euro(o.price_before)}</s><span className="pct">geschenkt</span></>}
            </div>

            <div className="facts">
              <div className="fact"><b>{dist(distance)}</b><span>{walkMin(distance)} zu Fuß</span></div>
              <div className="fact"><b className={tl.urgent ? 'urgent' : ''}>{tl.text}</b><span>Restzeit</span></div>
              <div className="fact"><b>{o.quota_remaining}</b><span>von {o.quota_total} frei</span></div>
            </div>

            {o.terms?.length > 0 && (
              <>
                <div className="terms-title">Gut zu wissen</div>
                <ul className="terms">
                  {o.terms.map((t, i) => <li key={i}><Icon name="check" size={15} stroke={2.1} /><span>{t}</span></li>)}
                </ul>
              </>
            )}
          </div>
        </div>

        <div className="sheet-foot">
          {o.has_voucher
            ? <>
                <button className="btn sec" onClick={() => onClose('gutscheine')}><Icon name="ticket" size={18} />Zu meinen Gutscheinen</button>
                <div className="hint">Bereits gesichert.</div>
              </>
            : <>
                <button className="btn" onClick={secure} disabled={saving || o.quota_remaining <= 0}>
                  {saving ? 'Wird gesichert...' : o.quota_remaining <= 0 ? 'Ausverkauft' : 'Jetzt sichern'}
                </button>
                <div className="hint">Kostenlos · Bezahlt wird im Geschäft</div>
              </>}
        </div>
      </div>
    </div>
  );
}

    { r: 500, label: '500 m', sub: 'Wenige Minuten zu Fuß' },

    <div className="overlay" onClick={e => e.target === e.currentTarget && onClose()}>

        <div className="sheet-pad">
          <h2>Wie weit willst du gehen?</h2>
          <p>Wir zeigen nur Angebote, die du in dieser Entfernung erreichst.</p>

// ─── Feed Screen ────────────────────────────────────────────────────
function FeedScreen() {
  const { geo, feedData, setFeedData, radius, setRadius, category, setCategory, openDeal, toggleFav } = useContext(AppCtx);
  const [radiusOpen, setRadiusOpen] = useState(false);
  const radii = [300, 500, 1000, 1500];
  const nextRadius = radii.find(r => r > radius);

  const load = useCallback(async () => {
    const data = await api(`/api/feed?lat=${geo.lat}&lng=${geo.lng}&radius=${radius}&category=${category || ''}`);
    setFeedData(data);
  }, [geo, radius, category]);

  useEffect(() => { load(); }, [load]);

  if (!feedData) return <CardSkeletons />;
  return (
    <>
      <div className="chips-wrap">
        <div className="chips">
          <button className="chip radius" onClick={() => setRadiusOpen(true)}>
            <Icon name="sliders" size={14} />{radius.toLocaleString('de-DE')} m
          </button>
          <button className={`chip${!category ? ' on' : ''}`} onClick={() => setCategory(null)}>
            Alle <span className="n">{feedData.total}</span>
          </button>
          {feedData.categories?.map(c => (
            <button key={c.id} className={`chip${category === c.id ? ' on' : ''}`} onClick={() => setCategory(c.id)}>
              {c.label} <span className="n">{c.count}</span>
            </button>
          ))}
        </div>
      </div>

      {feedData.offers.length === 0
        ? <div className="empty">
            <div className="empty-ic"><Icon name="map" size={28} /></div>
            <h3>Nichts im Umkreis</h3>
            <p>In {radius.toLocaleString('de-DE')} m läuft gerade keine Aktion. Erweitere den Umkreis oder wähle eine andere Kategorie.</p>
            {nextRadius && (
              <button className="btn" style={{ maxWidth: 240 }} onClick={() => setRadius(nextRadius)}>
                <Icon name="pin" size={17} />Auf {nextRadius.toLocaleString('de-DE')} m erweitern
              </button>
            )}
          </div>
        : <div className="feed">{feedData.offers.map(o => <DealCard key={o.id} offer={o} onOpen={openDeal} onFav={toggleFav} />)}</div>}

      {radiusOpen && <RadiusSheet radius={radius} onClose={() => setRadiusOpen(false)}
        onPick={r => { setRadius(r); setRadiusOpen(false); }} />}
    </>
  );
}

  const categories = feedData?.categories || [];

  useEffect(() => {
    if (q.length < 2) { setResults(null); return; }
    const t = setTimeout(async () => {
      const data = await api(`/api/search?q=${encodeURIComponent(q)}&lat=${geo.lat}&lng=${geo.lng}`);
      setResults(data.offers);
    }, 300);
    return () => clearTimeout(t);
  }, [q, geo]);

  const { setCategory, setTab } = useContext(AppCtx);
  const jumpCat = id => { setCategory(id); setTab('naehe'); };

  return (
    <>
      <div className="search-bar">
        <div className="search-inner">
          <Icon name="search" size={18} />
          <input value={q} onChange={e => setQ(e.target.value)} placeholder="Geschäft, Kategorie oder Angebot" autoFocus />
          {q && <button className="clear" onClick={() => setQ('')} aria-label="Suche leeren"><Icon name="close" size={13} stroke={2.2} /></button>}
        </div>
      </div>

      {results
        ? results.length > 0
          ? <div className="feed">{results.map(o => <DealCard key={o.id} offer={o} onOpen={openDeal} onFav={toggleFav} />)}</div>
          : <div className="empty">
              <div className="empty-ic"><Icon name="search" size={28} /></div>
              <h3>Kein Treffer</h3>
              <p>Für „{q}" läuft heute nichts. Versuch einen anderen Begriff.</p>
            </div>
        : <>
            <div className="section-title">Kategorien</div>
            <div className="cat-grid">
              {categories.map(c => (
                <button className="cat-tile" key={c.id} onClick={() => jumpCat(c.id)}>
                  <span className="cat-dot" style={{ background: catGrad(c.color) }}>{c.label[0]}</span>
                  <span><strong>{c.label}</strong><small>{c.count} Aktionen</small></span>
                </button>
              ))}
            </div>
          </>}
    </>
  );
}

function VoucherBon({ v, onReload }) {
  const { geo } = useContext(AppCtx);
  const [tl, setTl] = useState(timeLeft(v.expires_at));
  useEffect(() => { const i = setInterval(() => setTl(timeLeft(v.expires_at)), 1000); return () => clearInterval(i); }, [v.expires_at]);
  const used = v.status === 'redeemed';
  const expired = v.status === 'expired';

  return (
    <div className={`bon${used ? ' used' : ''}`}>
      {used && <span className="stamp">Eingelöst</span>}
      <div className="bon-top">
        <span className="who">
          <strong>{v.merchant_name}</strong>
          <small>{v.category_label}</small>
        </span>
        <span className="state">{used ? 'eingelöst' : expired ? 'abgelaufen' : 'gültig'}</span>
      </div>
      <div className="perf"><i /></div>
      <div className="bon-in">
        <h3>{v.title}</h3>
        <div className="addr">{v.street} {v.house_number || '–'} · {dist(haversineJS(geo.lat, geo.lng, v.mlat, v.mlng))}</div>
        <div className="bon-timer">
          <span>{used ? 'eingelöst um' : expired ? 'gültig bis' : 'noch gültig'}</span>
          <b className={tl.urgent && !used && !expired ? 'urgent' : ''}>
            {used
              ? new Date(v.redeemed_at).toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' }) + ' Uhr'
              : expired ? '–' : tl.text}
          </b>
        </div>
        {!used && !expired && (
          <div className="code-area">
            <div className="digits">{v.code}</div>
            <div className="barcode">{barcode(v.code)}</div>
          </div>
        )}
        <div className="note">{used ? 'Bereits verwendet' : expired ? 'Leider abgelaufen' : 'Im Geschäft vorzeigen · Personal scannt den Code'}</div>
      </div>
    </div>
  );
}

function haversineJS(lat1, lng1, lat2, lng2) {
  const R = 6371000, toR = d => d * Math.PI / 180;
  const dLat = toR(lat2 - lat1), dLng = toR(lng2 - lng1);
  const a = Math.sin(dLat / 2) ** 2 + Math.cos(toR(lat1)) * Math.cos(toR(lat2)) * Math.sin(dLng / 2) ** 2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}

// ─── Merchant Onboarding ────────────────────────────────────────────
function MerchantOnboarding() {
  const { user, setMerchant } = useContext(AppCtx);
  const [categories, setCategories] = useState([]);
  const [name, setName] = useState('');
  const [short, setShort] = useState('');
  const [shortTouched, setShortTouched] = useState(false);
  const [categoryId, setCategoryId] = useState('');
  const [street, setStreet] = useState('');
  const [houseNumber, setHouseNumber] = useState('');
  const [description, setDescription] = useState('');
  const [lat, setLat] = useState('');
  const [lng, setLng] = useState('');
  const [geoSource, setGeoSource] = useState(null); // null | 'gps' | 'manual'
  const [locating, setLocating] = useState(false);
  const [geoErr, setGeoErr] = useState('');
  const [err, setErr] = useState('');
  const [saving, setSaving] = useState(false);

  const latNum = parseFloat(lat), lngNum = parseFloat(lng);
  const hasLocation = Number.isFinite(latNum) && Number.isFinite(lngNum) && (latNum !== 0 || lngNum !== 0);
  const missing = [
    [!name.trim(), 'Geschäftsname'],
    [!short.trim(), 'Kurzform'],
    [!categoryId, 'Kategorie'],
    [!street.trim(), 'Straße'],
    [houseNumber === '', 'Hausnummer'],
    [!hasLocation, 'Standort']
  ].filter(([m]) => m).map(([, label]) => label);
  const complete = missing.length === 0;

  useEffect(() => { api('/api/categories').then(setCategories).catch(() => {}); }, []);

  const useCurrentPosition = () => {
    setGeoErr('');
    if (!('geolocation' in navigator)) { setGeoErr('Dein Browser unterstützt keine Standortbestimmung. Bitte trage die Koordinaten manuell ein.'); setGeoSource('manual'); return; }
    setLocating(true);
    navigator.geolocation.getCurrentPosition(
      pos => {
        setLat(pos.coords.latitude.toFixed(5));
        setLng(pos.coords.longitude.toFixed(5));
        setGeoSource('gps');
        setLocating(false);
      },
      () => {
        setGeoErr('Standort konnte nicht ermittelt werden. Bitte trage die Koordinaten manuell ein.');
        setGeoSource('manual');
        setLocating(false);
      },
      { enableHighAccuracy: true, timeout: 8000 }
    );
  };

  const submit = async () => {
    setErr(''); setSaving(true);
    try {
      const created = await api('/api/merchant/setup', { method: 'POST', body: JSON.stringify({
        name: name.trim(),
        short: short.trim().toUpperCase(),
        category_id: categoryId,
        street: street.trim(),
        house_number: parseInt(houseNumber, 10),
        lat: latNum,
        lng: lngNum,
        description: description.trim()
      }) });
      setMerchant(created);
    } catch (e) { setErr(e.message); setSaving(false); }
  };

  const changeName = v => {
    setName(v);
    if (!shortTouched) setShort(v.trim().slice(0, 2).toUpperCase());
  };

  const activeCat = categories.find(c => c.id === categoryId);

  return (
    <>
      <div className="onb">
        <div className="onb-head">
          <div className="brand" style={{ width: 52, height: 52, borderRadius: 18, fontSize: 22, marginBottom: 0 }}>
            <span><Icon name="store" size={24} stroke={1.9} /></span>
          </div>
          <div>
            <h1>Willkommen, {user.name}</h1>
            <p>Richte dein Geschäft ein, bevor du Angebote veröffentlichen kannst.</p>
          </div>
        </div>

        {err && <div className="err" style={{ marginBottom: 12 }}><Icon name="alert" size={17} /><span>{err}</span></div>}

        <div className="step">
          <div className="step-head">
            <span className="step-no">1</span>
            <div><h3>Dein Geschäft</h3><small>So erscheint es im Feed</small></div>
          </div>
          <div className="field">
            <label>Geschäftsname</label>
            <input autoComplete="off" value={name} onChange={e => changeName(e.target.value)} placeholder="z.B. Café Sonntag" />
          </div>
          <div className="ava-preview">
            <span className="ava" style={{ background: catGrad(activeCat ? activeCat.color : '#1B3A93') }}>
              <span>{short || '··'}</span>
            </span>
            <span className="txt">
              <b>Kurzform für den Avatar</b>
              Automatisch aus dem Namen, du kannst sie überschreiben.
            </span>
          </div>
          <div className="field">
            <label>Kurzform (max. 2 Zeichen)</label>
            <input autoComplete="off" value={short} maxLength={2}
              onChange={e => { setShortTouched(true); setShort(e.target.value.toUpperCase()); }}
              placeholder="CS" style={{ maxWidth: 110, textAlign: 'center', fontFamily: 'var(--mono)', letterSpacing: '.1em' }} />
          </div>
          <div className="field">
            <label>Kategorie</label>
            <select autoComplete="off" value={categoryId} onChange={e => setCategoryId(e.target.value)}>
              <option value="">Bitte wählen</option>
              {categories.map(c => <option key={c.id} value={c.id}>{c.label}</option>)}
            </select>
          </div>
        </div>

        <div className="step">
          <div className="step-head">
            <span className="step-no">2</span>
            <div><h3>Adresse</h3><small>Wo finden Kunden dich?</small></div>
          </div>
          <div className="field">
            <div className="row">
              <div className="field" style={{ flex: 2 }}>
                <label>Straße</label>
                <input autoComplete="off" value={street} onChange={e => setStreet(e.target.value)} placeholder="Kaiserstraße" />
              </div>
              <div className="field" style={{ flex: 1 }}>
                <label>Hausnummer</label>
                <input autoComplete="off" type="number" value={houseNumber} onChange={e => setHouseNumber(e.target.value)} placeholder="14" />
              </div>
            </div>
          </div>
          <div className="field">
            <label>Kurzbeschreibung (optional)</label>
            <textarea autoComplete="off" value={description} maxLength={200} rows={3}
              onChange={e => setDescription(e.target.value)} placeholder="Was macht dein Geschäft aus?" />
            <div className="counter">{description.length}/200</div>
          </div>
        </div>

        <div className="step">
          <div className="step-head">
            <span className="step-no">3</span>
            <div><h3>Standort</h3><small>Für die Entfernung zu Kunden</small></div>
          </div>
          {geoErr && <div className="err"><Icon name="alert" size={17} /><span>{geoErr}</span></div>}
          {geoSource === 'gps'
            ? <div className="geo-box">
                <Icon name="shield" size={22} />
                <span className="coords"><small>Standort erfasst</small>{lat}, {lng}</span>
                <button className="mini-btn" onClick={() => setGeoSource('manual')}>Ändern</button>
              </div>
            : <>
                <button className="btn blau" onClick={useCurrentPosition} disabled={locating}>
                  <Icon name="crosshair" size={18} />
                  {locating ? 'Standort wird ermittelt...' : 'Meinen aktuellen Standort verwenden'}
                </button>
                <div className="divider">oder manuell eintragen</div>
                <div className="field">
                  <div className="row">
                    <div className="field" style={{ flex: 1 }}>
                      <label>Breitengrad</label>
                      <input autoComplete="off" type="number" step="0.00001" value={lat}
                        onChange={e => { setLat(e.target.value); setGeoSource('manual'); }} placeholder="50.10082" />
                    </div>
                    <div className="field" style={{ flex: 1 }}>
                      <label>Längengrad</label>
                      <input autoComplete="off" type="number" step="0.00001" value={lng}
                        onChange={e => { setLng(e.target.value); setGeoSource('manual'); }} placeholder="8.76432" />
                    </div>
                  </div>
                </div>
                <p className="tip">
                  <Icon name="info" size={17} />
                  <span>Findest du die Koordinaten nicht? Suche deine Adresse bei{' '}
                    <a href="https://maps.google.com" target="_blank" rel="noopener noreferrer">maps.google.com</a>,
                    {' '}Rechtsklick auf den Punkt zeigt sie an.</span>
                </p>
              </>}
        </div>
      </div>

      <div className="sticky-foot">
        <button className="btn" onClick={submit} disabled={!complete || saving}>
          {saving ? 'Wird angelegt...' : <>Geschäft anlegen<Icon name="chevronRight" size={18} /></>}
        </button>
        {!complete && <div className="hint">Noch offen: {missing.join(', ')}</div>}
      </div>
    </>
  );
}

// ─── Merchant Dashboard ─────────────────────────────────────────────
function offerBucket(o) {
  const ended = o.status === 'expired' || new Date(o.ends_at) <= new Date();
  if (ended) return 'past';
  if (o.status === 'paused') return 'available';
  if (o.status === 'active') return 'active';
  return 'past';
}

function MerchantDashboard() {
  const { merchant } = useContext(AppCtx);
  const [stats, setStats] = useState(null);
  const [voucherGroups, setVoucherGroups] = useState(null);
  const [view, setView] = useState('dash');
  const [offerFilter, setOfferFilter] = useState('active');
  const [voucherFilter, setVoucherFilter] = useState('active');
  const [scanCode, setScanCode] = useState('');
  const [scanResult, setScanResult] = useState(null);
  const [form, setForm] = useState({ title: '', price_before: '', price_after: '', quota_total: 20, duration_hours: 4, terms: '' });

  const load = async () => {
    try {
      setStats(await api('/api/merchant/stats'));
      setVoucherGroups(await api('/api/merchant/vouchers'));
    } catch {}
  };
  useEffect(() => { load(); }, []);

  const pending = merchant?.activation_status === 'pending';
  const rejected = merchant?.activation_status === 'rejected';
  const shopUrl = merchant?.slug ? `${window.location.origin}/geschaeft/${merchant.slug}` : null;

  const createOffer = async () => {
    try {
      const terms = form.terms.split('\n').filter(t => t.trim());
      await api('/api/merchant/offers', { method: 'POST', body: JSON.stringify({
        title: form.title, price_before: parseFloat(form.price_before),
        price_after: form.price_after ? parseFloat(form.price_after) : null,
        is_free: !form.price_after, quota_total: parseInt(form.quota_total),
        duration_hours: parseInt(form.duration_hours), terms
      }) });
      setForm({ title: '', price_before: '', price_after: '', quota_total: 20, duration_hours: 4, terms: '' });
      setView('dash'); load();
    } catch (e) { alert(e.message); }
  };

  const redeem = async () => {
    setScanResult(null);
    try {
      const res = await api('/api/merchant/redeem', { method: 'POST', body: JSON.stringify({ code: scanCode.toUpperCase() }) });
      setScanResult(res.status === 'already_redeemed'
        ? { type: 'dup', msg: `Bereits eingelöst am ${new Date(res.redeemed_at).toLocaleString('de-DE')}` }
        : { type: 'ok', msg: `Eingelöst: ${res.title}` });
      setScanCode(''); load();
    } catch (e) { setScanResult({ type: 'err', msg: e.message }); }
  };

  const toggleOffer = async (id) => {
    await api(`/api/merchant/offers/${id}/pause`, { method: 'PUT' });
    load();
  };

  if (!stats) return <CardSkeletons n={3} />;

  const offerFilters = [
    { id: 'active', label: 'Aktiv' },
    { id: 'past', label: 'Vergangen' },
    { id: 'available', label: 'Verfügbar' }
  ];
  const vchFilters = [
    { id: 'active', label: 'Aktiv' },
    { id: 'redeemed', label: 'Eingelöst' },
    { id: 'expired', label: 'Abgelaufen' }
  ];
  const vchList = voucherGroups ? (voucherGroups[voucherFilter] || []) : [];

  return (
    <>
      {(pending || rejected) && (
        <div className="pending-banner">
          <Icon name="info" size={22} />
          <div>
            <strong>{rejected ? 'Freigabe abgelehnt' : 'Freigabe ausstehend'}</strong>
            {rejected
              ? 'Dein Geschäft wurde nicht freigeschaltet. Bitte wende dich an info@50meter.de.'
              : 'Dein Geschäft wird vom Betreiber geprüft. Bis zur Freigabe sind Angebote nicht öffentlich sichtbar.'}
          </div>
        </div>
      )}

      {shopUrl && merchant?.activation_status === 'active' && (
        <div style={{ padding: '10px 16px 0' }}>
          <button type="button" className="shop-link" onClick={() => window.open(shopUrl, '_blank')}>
            Deine Geschäftsseite · /geschaeft/{merchant.slug}
            <Icon name="chevronRight" size={16} />
          </button>
        </div>
      )}

      <div className="m-seg">
        <div className="seg" role="group" aria-label="Bereich wählen">
          <button className={view === 'dash' ? 'on' : ''} onClick={() => setView('dash')}><Icon name="chart" size={16} />Übersicht</button>
          <button className={view === 'scan' ? 'on' : ''} onClick={() => setView('scan')}><Icon name="scan" size={16} />Scanner</button>
          <button className={view === 'create' ? 'on' : ''} onClick={() => setView('create')} disabled={pending || rejected}><Icon name="plus" size={16} />Angebot</button>
        </div>
      </div>

      {view === 'dash' && (
        <>
          <div className="m-stats">
            <div className="m-stat"><b>{stats.activeOffers}</b><span>Aktiv</span></div>
            <div className="m-stat"><b>{stats.totalReserved}</b><span>Gesichert</span></div>
            <div className="m-stat hot"><b>{stats.totalRedeemed}</b><span>Eingelöst</span></div>
            <div className="m-stat hot"><b>{stats.redemptionRate}%</b><span>Quote</span></div>
          </div>
          <div className="section-title">Angebote</div>
          <div className="m-subseg" role="tablist">
            {offerFilters.map(f => (
              <button key={f.id} type="button" className={offerFilter === f.id ? 'on' : ''} onClick={() => setOfferFilter(f.id)}>{f.label}</button>
            ))}
          </div>
          <MerchantOffers filter={offerFilter} onToggle={toggleOffer} onCreate={() => setView('create')} bucketFn={offerBucket} />

          <div className="section-title" style={{ marginTop: 8 }}>Gutscheine</div>
          <div className="m-subseg" role="tablist">
            {vchFilters.map(f => (
              <button key={f.id} type="button" className={voucherFilter === f.id ? 'on' : ''} onClick={() => setVoucherFilter(f.id)}>{f.label}</button>
            ))}
          </div>
          <div className="m-offers">
            {!voucherGroups ? <CardSkeletons n={1} /> : vchList.length === 0 ? (
              <p style={{ padding: '4px 0', fontSize: 13.5, color: 'var(--grau)' }}>Keine Gutscheine in dieser Kategorie.</p>
            ) : vchList.map(v => (
              <div className="vch-row" key={v.id}>
                <span><strong>{v.title}</strong><br /><small style={{ color: 'var(--grau)' }}>{new Date(v.reserved_at).toLocaleString('de-DE')}</small></span>
                <code>{v.code}</code>
              </div>
            ))}
          </div>
        </>

      {view === 'scan' && (

          <div className="empty-ic"><Icon name="scan" size={28} /></div>

          <p>Gutscheincode des Kunden eingeben — sechs Zeichen.</p>

            <div className={`scan-result ${scanResult.type}`}>
              <Icon name={scanResult.type === 'ok' ? 'check' : scanResult.type === 'dup' ? 'info' : 'alert'} size={18} stroke={2} />
              <span>{scanResult.msg}</span>
            </div>

      {view === 'create' && (
        <div className="form-wrap">
          <h3>Neues Angebot</h3>
          <div className="field">
            <label>Titel</label>
            <input value={form.title} onChange={e => setForm({ ...form, title: e.target.value })} placeholder="z.B. 2 für 1 Kaffee" />

          <div className="field">
            <div className="row">
              <div className="field" style={{ flex: 1 }}>
