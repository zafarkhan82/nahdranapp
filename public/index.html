              <div className="field" style={{ flex: 1 }}>
                <label>Angebotspreis (€)</label>
                <input type="number" step="0.01" value={form.price_after} onChange={e => setForm({ ...form, price_after: e.target.value })} placeholder="3.40" />
              </div>
            </div>
          </div>
          <p className="tip"><Icon name="gift" size={17} /><span>Angebotspreis leer lassen heißt: das Angebot ist gratis.</span></p>
          <div className="field">
            <div className="row">
              <div className="field" style={{ flex: 1 }}>
                <label>Kontingent</label>
                <input type="number" value={form.quota_total} onChange={e => setForm({ ...form, quota_total: e.target.value })} />
              </div>
              <div className="field" style={{ flex: 1 }}>
                <label>Laufzeit (Std.)</label>
                <input type="number" value={form.duration_hours} onChange={e => setForm({ ...form, duration_hours: e.target.value })} />
              </div>
            </div>
          </div>
          <div className="field">
            <label>Bedingungen (eine pro Zeile)</label>
            <textarea value={form.terms} onChange={e => setForm({ ...form, terms: e.target.value })} rows={3}
              placeholder="Nur vor Ort&#10;Ein Gutschein pro Person" />
          </div>
          <button className="btn" onClick={createOffer} disabled={!form.title || !form.price_before}>
            <Icon name="spark" size={18} />Veröffentlichen
          </button>
        </div>
      )}
    </>
  );
}

function MerchantOffers({ filter, onToggle, onCreate, bucketFn }) {
  const [offers, setOffers] = useState([]);
  useEffect(() => { api('/api/merchant/offers').then(d => setOffers(d.offers)).catch(() => {}); }, []);

  const filtered = offers.filter(o => bucketFn(o) === filter);
  const list = filtered;

  if (!offers.length) return (
    <div className="empty">
      <div className="empty-ic"><Icon name="tag" size={28} /></div>
      <h3>Keine Angebote</h3>
      <p>Leg dein erstes Angebot an — nach Freigabe erscheint es im Feed der Nachbarschaft.</p>
      <button className="btn" style={{ maxWidth: 240 }} onClick={onCreate}><Icon name="plus" size={18} />Angebot anlegen</button>
    </div>
  );
  if (!list.length) return (
    <p className="m-offers" style={{ fontSize: 13.5, color: 'var(--grau)' }}>Keine Angebote in dieser Kategorie.</p>
  );
  return (
    <div className="m-offers">
      {list.map(o => {
        const tl = timeLeft(o.ends_at);
        const bucket = bucketFn(o);
        return (
          <div className="m-offer" key={o.id}>
            <div className="txt">
              <h4>{o.title}</h4>
              <small>{o.quota_reserved}/{o.quota_total} gesichert · {bucket === 'past' ? 'beendet' : tl.text}</small>
            </div>
            {bucket !== 'past' && (
              <button className={`st ${o.status}`} onClick={() => onToggle(o.id)}>
                {o.status === 'active' ? 'Aktiv' : o.status === 'paused' ? 'Pausiert' : 'Abgelaufen'}
              </button>
            )}
          </div>
        );
      })}
    </div>
  );
}

// ─── Admin ──────────────────────────────────────────────────────────
function AdminDashboard() {
  const [tab, setTab] = useState('pending');
  const [merchants, setMerchants] = useState([]);
  const [loading, setLoading] = useState(true);

  const load = async () => {
    setLoading(true);
    try {
      const d = await api(`/api/admin/merchants?status=${tab}`);
      setMerchants(d.merchants || []);
    } catch (e) { alert(e.message); }
    setLoading(false);
  };
  useEffect(() => { load(); }, [tab]);

  const act = async (id, action) => {
    await api(`/api/admin/merchants/${id}/${action}`, { method: 'POST' });
    load();
  };

  const tabs = [
    { id: 'pending', label: 'Neu' },
    { id: 'active', label: 'Aktiv' },
    { id: 'rejected', label: 'Abgelehnt' }
  ];

  return (
    <>
      <div className="m-seg">
        <div className="seg" role="group">
          {tabs.map(t => (
            <button key={t.id} className={tab === t.id ? 'on' : ''} onClick={() => setTab(t.id)}>{t.label}</button>
          ))}
        </div>
      </div>
      {loading ? <CardSkeletons n={3} /> : (
        <div className="admin-list">
          {merchants.length === 0 ? (
            <div className="empty"><p>Keine Einträge.</p></div>
          ) : merchants.map(m => (
            <div className="admin-card" key={m.id}>
              <h4>{m.name}</h4>
              <small>{m.owner_name} · {m.owner_email}<br />
                {m.street} {m.house_number} · {m.category_label}<br />
                Slug: /geschaeft/{m.slug}</small>
              {tab === 'pending' && (
                <div className="admin-actions">
                  <button className="btn" onClick={() => act(m.id, 'activate')}><Icon name="check" size={16} />Freischalten</button>
                  <button className="btn sec" onClick={() => act(m.id, 'reject')}>Ablehnen</button>
                </div>
              )}
              {tab === 'active' && m.slug && (
                <button type="button" className="shop-link" style={{ marginTop: 10 }} onClick={() => window.open(`/geschaeft/${m.slug}`, '_blank')}>
                  Geschäftsseite öffnen <Icon name="chevronRight" size={16} />
                </button>
              )}
            </div>
          ))}
        </div>
      )}
    </>
  );
}

// ─── Shop (öffentliche Seite) ───────────────────────────────────────
function ShopScreen({ slug, onBack, onOpenDeal }) {
  const { geo, toggleFav, refresh } = useContext(AppCtx);
  const [data, setData] = useState(null);

  useEffect(() => {
    if (!slug) return;
    api(`/api/shops/${encodeURIComponent(slug)}`).then(setData).catch(() => setData({ error: true }));
  }, [slug]);

  if (!data) return <CardSkeletons n={2} />;
  if (data.error) return (
    <div className="empty">
      <h3>Geschäft nicht gefunden</h3>
      <button className="btn sec" onClick={onBack}>Zurück</button>
    </div>
  );

  const m = data.merchant;
  const distM = Math.round(haversineJS(geo.lat, geo.lng, m.lat, m.lng));

  const toggleFavShop = async () => {
    if (m.is_favourite) await api(`/api/favourites/${m.id}`, { method: 'DELETE' });
    else await api('/api/favourites', { method: 'POST', body: JSON.stringify({ merchantId: m.id }) });
    refresh();
    setData(d => ({ ...d, merchant: { ...d.merchant, is_favourite: !d.merchant.is_favourite } }));
  };

  return (
    <div style={{ paddingBottom: 24 }}>
      <div style={{ padding: '12px 16px 0' }}>
        <button type="button" className="shop-link" onClick={onBack}><Icon name="chevronRight" size={16} style={{ transform: 'rotate(180deg)' }} />Zurück</button>
      </div>
      <div className="shop-hero">
        <div className="init" style={{ background: catGrad(m.category_color) }}>{m.short}</div>
        <span className="c-cat">{m.category_label}</span>
        <h2>{m.name}</h2>
        <div className="addr">{m.street} {m.house_number || '–'}{m.address ? ` · ${m.address}` : ''}</div>
        <div className="addr" style={{ marginTop: 4 }}><Icon name="pin" size={14} /> {dist(distM)} entfernt</div>
        {m.description && <p className="desc">{m.description}</p>}
        <button type="button" className={`fav-btn${m.is_favourite ? ' on' : ''}`} style={{ position: 'static', marginTop: 12 }} onClick={toggleFavShop}>
          <Icon name="heart" size={17} fill={m.is_favourite ? 'currentColor' : 'none'} /> Favorit
        </button>
      </div>
      <div className="section-title">Aktuelle Angebote</div>
      {data.offers.length === 0 ? (
        <p style={{ padding: '0 16px', color: 'var(--grau)', fontSize: 13.5 }}>Gerade keine laufenden Aktionen.</p>
      ) : (
        <div className="feed" style={{ paddingTop: 0 }}>
          {data.offers.map(o => (
            <DealCard key={o.id} offer={{
              ...o, merchant_name: m.name, merchant_short: m.short, merchant_slug: m.slug,
              category_label: m.category_label, category_color: m.category_color,
              house_number: m.house_number, street: m.street, distance: distM,
              is_favourite: m.is_favourite
            }} onOpen={onOpenDeal} onFav={() => toggleFavShop()} />
          ))}
        </div>
      )}
      {data.pastOffers?.length > 0 && (
        <>
          <div className="section-title">Frühere Aktionen</div>
          <div className="m-offers">
            {data.pastOffers.map(o => (
              <div className="m-offer" key={o.id}><div className="txt"><h4>{o.title}</h4><small>beendet</small></div></div>
            ))}
          </div>
        </>
      )}
    </div>
  );
}

function parseShopSlug() {
  const m = window.location.pathname.match(/^\/geschaeft\/([^/]+)\/?$/);
  return m ? decodeURIComponent(m[1]) : null;
}

function navigateShop(slug) {
  const path = slug ? `/geschaeft/${encodeURIComponent(slug)}` : '/';
  if (window.location.pathname !== path) window.history.pushState({ shop: slug || null }, '', path);
}

// ─── Push Banner ────────────────────────────────────────────────────
function PushBanner({ push, onTap }) {
  if (!push) return null;
  return (
    <button className={`push-banner${push ? ' show' : ''}`} onClick={onTap}>
      <span className="push-ic"><Icon name="pin" size={19} /></span>
      <span className="push-body">
        <span className="app-name">Nahdran · jetzt</span>
        <span className="msg">{push.title}</span>
        <span className="sub">{push.body}</span>
      </span>
      <Icon name="chevronRight" size={18} style={{ color: 'var(--grau)' }} />
    </button>
  );
}

// ─── Geo Consent Sheet ──────────────────────────────────────────────
function GeoConsentSheet({ onAccept, onDecline }) {
  return (
    <div className="overlay" onClick={e => e.target === e.currentTarget && onDecline()}>
      <div className="sheet" role="dialog" aria-modal="true" aria-label="Standort verwenden">
        <div className="grip"><i /></div>
        <div className="sheet-pad">
          <div className="sheet-ic"><Icon name="pin" size={26} stroke={1.9} /></div>
          <h2>Standort verwenden?</h2>
          <p>Nahdran nutzt deinen Standort, um Angebote in deiner Nähe zu zeigen.
            Dein Standortverlauf wird nicht gespeichert.</p>
          <p style={{ fontSize: 12.5, color: 'var(--grau)', marginTop: 12 }}>
            Mehr dazu in der <a href="/datenschutz" target="_blank" rel="noopener noreferrer">Datenschutzerklärung</a>.
          </p>
        </div>
        <div className="sheet-foot">
          <button className="btn blau" onClick={onAccept}><Icon name="shield" size={18} />Verstanden, Standort erlauben</button>
          <button className="btn sec" style={{ marginTop: 8 }} onClick={onDecline}>Nicht jetzt</button>
        </div>
      </div>
    </div>
  );
}

// ─── App ────────────────────────────────────────────────────────────
function App() {
  const [user, setUser] = useState(null);
  const [merchant, setMerchant] = useState(null);
  const [tab, setTab] = useState('naehe');
  const [geo, setGeo] = useState({ lat: 50.1005, lng: 8.7648, source: 'default' });
  const [geoAsked, setGeoAsked] = useState(false);
  const [geoConsent, setGeoConsent] = useState(false);
  const [feedData, setFeedData] = useState(null);
  const [radius, setRadius] = useState(500);
  const [category, setCategory] = useState(null);
  const [detailId, setDetailId] = useState(null);
  const [push, setPush] = useState(null);
  const [refreshKey, setRefreshKey] = useState(0);
  const [shopSlug, setShopSlug] = useState(() => parseShopSlug());
  const refresh = () => setRefreshKey(k => k + 1);

  // restore session
  useEffect(() => {
    if (getToken()) {
      api('/api/auth/me').then(d => { setMerchant(d.merchant || null); setUser(d.user); })
        .catch(() => localStorage.removeItem('nahdran_token'));
    }
  }, []);

  useEffect(() => {
    const onPop = () => setShopSlug(parseShopSlug());
    const onShop = (e) => {
      const slug = e.detail;
      setShopSlug(slug);
      navigateShop(slug);
      setDetailId(null);
    };
    window.addEventListener('popstate', onPop);
    window.addEventListener('nahdran:shop', onShop);
    return () => {
      window.removeEventListener('popstate', onPop);
      window.removeEventListener('nahdran:shop', onShop);
    };
  }, []);

  const closeShop = () => { setShopSlug(null); navigateShop(null); };

  // geo — eigener Einwilligungsschritt vor dem nativen Browser-Dialog
  const requestGeo = () => {
    setGeoConsent(false);
    setGeoAsked(true);
    if ('geolocation' in navigator) {
      navigator.geolocation.getCurrentPosition(
        pos => setGeo({ lat: pos.coords.latitude, lng: pos.coords.longitude, source: 'gps' }),
        () => setGeo(g => ({ ...g, source: 'denied' })),
        { enableHighAccuracy: true, timeout: 8000 }
      );
      navigator.geolocation.watchPosition(
        pos => setGeo({ lat: pos.coords.latitude, lng: pos.coords.longitude, source: 'gps' }),
        () => {}, { enableHighAccuracy: false, maximumAge: 30000 }
      );
    }
  };

  // push simulation
  useEffect(() => {
    if (!user || user.role !== 'consumer') return;
    const timer = setTimeout(async () => {
      try {
        const data = await api('/api/push/simulate', { method: 'POST', body: JSON.stringify({ lat: geo.lat, lng: geo.lng }) });
        if (data.push) {
          setPush(data.push);
          if ('Notification' in window && Notification.permission === 'granted') {
            new Notification('Nahdran', { body: `${data.push.title} · ${data.push.body}`, icon: '/favicon.ico' });
          }
          setTimeout(() => setPush(null), 8000);
        }
      } catch {}
    }, 4000);
    return () => clearTimeout(timer);
  }, [user, geo]);

  // request notification permission
  useEffect(() => {
    if ('Notification' in window && Notification.permission === 'default') {
      setTimeout(() => Notification.requestPermission(), 5000);
    }
  }, [user]);

  const openDeal = id => setDetailId(id);
  const closeDeal = (goTab) => { setDetailId(null); if (goTab) setTab(goTab); };

  const toggleFav = async (offer) => {
    if (offer.is_favourite) { await api(`/api/favourites/${offer.merchant_id}`, { method: 'DELETE' }); }
    else { await api('/api/favourites', { method: 'POST', body: JSON.stringify({ merchantId: offer.merchant_id }) }); }
    refresh();
    setFeedData(fd => fd ? { ...fd, offers: fd.offers.map(o => o.id === offer.id ? { ...o, is_favourite: !o.is_favourite } : o) } : fd);
  };

  const logout = () => { localStorage.removeItem('nahdran_token'); setUser(null); setMerchant(null); setFeedData(null); };

  const ctx = { user, setUser, merchant, setMerchant, geo, feedData, setFeedData, radius, setRadius, category, setCategory, openDeal, toggleFav, refresh, setTab };

  if (!user) return <AppCtx.Provider value={ctx}><AuthScreen /></AppCtx.Provider>;

  const isAdmin = user.role === 'admin';
  const isMerchant = user.role === 'merchant';
  const gpsLive = geo.source === 'gps';
  const statusText = gpsLive
    ? `Standort aktiv · ${feedData?.total ?? '–'} Aktionen`
    : feedData ? `${feedData.total} Aktionen · Offenbach Innenstadt` : 'Angebote werden geladen';

  const tabs = [
    { id: 'naehe', label: 'Nähe', icon: 'pin' },
    { id: 'suche', label: 'Suche', icon: 'search' },
    { id: 'favoriten', label: 'Favoriten', icon: 'heart' },
    { id: 'gutscheine', label: 'Gutscheine', icon: 'ticket' }
  ];

  return (
    <AppCtx.Provider value={ctx}>
      <div className="app">
        <PushBanner push={push} onTap={() => { if (push?.offer_id) { openDeal(push.offer_id); setPush(null); } }} />

        <header className="hdr">
          <div className="hdr-row">
            <div>
              <div className="eyebrow">{isAdmin ? 'Administration' : isMerchant ? 'Händler-Dashboard' : 'Offenbach · Innenstadt'}</div>
              <h1>{isAdmin ? 'Freigaben' : isMerchant ? user.name : shopSlug ? 'Geschäft' : 'Kaiserstraße'}</h1>
            </div>
            <div className="hdr-actions">
              <button className="hdr-btn" onClick={logout} aria-label="Abmelden"><Icon name="logout" size={18} /></button>
            </div>
          </div>

          {isAdmin
            ? <div className="geo-pill live"><span className="dot" />Händler & Geschäfte freischalten</div>
            : isMerchant
            ? merchant && <div className="geo-pill live"><span className="dot" />{merchant.street} {merchant.house_number}</div>
            : <div className={`geo-pill${gpsLive ? ' live' : ''}`}><span className="dot" />{statusText}</div>}

          {!isMerchant && !isAdmin && !geoAsked && (
            <button className="geo-cta" onClick={() => setGeoConsent(true)}>
              <Icon name="crosshair" size={20} />
              <span>
                <strong>Standort aktivieren</strong>
                <span>Für exakte Entfernungen in Laufweite</span>
              </span>
              <Icon name="chevronRight" size={18} className="go" />
            </button>
          )}
        </header>

        <div className="main" key={refreshKey}>
          {isAdmin
            ? <AdminDashboard />
            : isMerchant
            ? (merchant ? <MerchantDashboard /> : <MerchantOnboarding />)
            : shopSlug
            ? <ShopScreen slug={shopSlug} onBack={closeShop} onOpenDeal={openDeal} />
            : <>
                {tab === 'naehe' && <FeedScreen />}
                {tab === 'suche' && <SearchScreen />}
                {tab === 'favoriten' && <FavScreen />}
                {tab === 'gutscheine' && <VoucherScreen />}
              </>}
        </div>

        {!isMerchant && !isAdmin && !shopSlug && (
          <nav className="tabs">
            {tabs.map(t => (
              <button key={t.id} className={`tab${tab === t.id ? ' on' : ''}`} onClick={() => setTab(t.id)}
                aria-current={tab === t.id ? 'page' : undefined}>
                <span className="tab-ic">
                  <Icon name={t.icon} size={19} fill={t.id === 'favoriten' && tab === t.id ? 'currentColor' : 'none'} />
                </span>
                <span>{t.label}</span>
              </button>
            ))}
          </nav>
        )}

        {geoConsent && <GeoConsentSheet
          onAccept={requestGeo}
          onDecline={() => { setGeoConsent(false); setGeoAsked(true); }} />}

        {detailId && <DealSheet offerId={detailId} onClose={closeDeal} />}
      </div>
    </AppCtx.Provider>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
